<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fond Rouge Harmonieux -->
  <rect width="512" height="512" rx="110" fill="url(#redGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8"/>
  
  <!-- Étoile Chérifienne Marocaine (Pentagramme Vert Émeraude) -->
  <g filter="url(#glow)">
    <!-- Contour doré subtil -->
    <polygon points="256,90 352,386 102,204 410,204 160,386" 
             fill="none" stroke="#F59E0B" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Ligne verte marocaine -->
    <polygon points="256,90 352,386 102,204 410,204 160,386" 
             fill="none" stroke="#047857" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>