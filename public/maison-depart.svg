<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Carré rouge fond officiel (#C1272D) -->
  <rect width="512" height="512" rx="36" fill="#C1272D" />
  
  <!-- Structure de la Maison avec Toit Vert Marocain (#006233) -->
  <g id="house-structure">
    <!-- Toit triangulaire vert en surplomb -->
    <polygon points="256,76 430,220 376,220 256,122 136,220 82,220" fill="#006233" />
    <path d="M256 70 L438 222 L388 222 L256 112 L124 222 L74 222 Z" fill="#006233" />
    
    <!-- Murs / corps de la maison en blanc épuré sur le fond rouge -->
    <path d="M142 220 V410 H370 V220" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Lettres DS à l'intérieur de la maison -->
  <g id="ds-letters" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140">
    <!-- Lettre D (vert marocain avec lueur blanche) -->
    <text x="170" y="360" fill="#006233" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill" text-anchor="middle">D</text>
    <!-- Lettre S (vert marocain / touche ambrée marocaine avec lueur blanche) -->
    <text x="320" y="360" fill="#F59E0B" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill" text-anchor="middle">S</text>
  </g>
</svg>
